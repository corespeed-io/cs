name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Manifests are valid JSON
        run: |
          for f in .agents/plugins/marketplace.json .claude-plugin/marketplace.json .cursor-plugin/marketplace.json \
            plugins/corespeed/.codex-plugin/plugin.json plugins/corespeed/.claude-plugin/plugin.json \
            plugins/corespeed/.cursor-plugin/plugin.json \
            plugins/corespeed/.mcp.json plugins/corespeed/.mcp.claude.json plugins/corespeed-cli/.codex-plugin/plugin.json; do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
      - name: The MCP servers sign in with OAuth
        # The plugin must never ask for an API key: the client discovers the
        # authorization server from the server's challenge (RFC 9728), so each
        # entry carries only the URL — no headers, no token env var, no oauth_resource.
        run: |
          jq -e '.mcpServers | length == 1 and (.corespeed | keys == ["type", "url"])' plugins/corespeed/.mcp.json > /dev/null \
            || { echo "::error file=plugins/corespeed/.mcp.json::expected exactly {type, url}"; exit 1; }
          jq -e '.mcpServers | length == 1 and (.corespeed | keys == ["type", "url"])' plugins/corespeed/.mcp.claude.json > /dev/null \
            || { echo "::error file=plugins/corespeed/.mcp.claude.json::expected exactly {type, url}"; exit 1; }
      - name: Codex and the Directory get the plugin surface; Claude Code the full server
        # The OpenAI Plugins Directory accepts mcpServers only as the root
        # ./.mcp.json, so that file is the fixed plugin surface
        # /mcp/plugin/chatgpt (shared memory), which no
        # organization's connector count can push past Codex's catalog limit.
        # Claude Code loads .mcp.json first and then the file its manifest
        # names; the later `corespeed` entry replaces the earlier one, so it
        # gets the full /mcp from .mcp.claude.json.
        run: |
          [ "$(jq -r .mcpServers plugins/corespeed/.codex-plugin/plugin.json)" = "./.mcp.json" ] \
            || { echo "::error file=plugins/corespeed/.codex-plugin/plugin.json::mcpServers must be ./.mcp.json (the Directory accepts no other path)"; exit 1; }
          [ "$(jq -r .mcpServers.corespeed.url plugins/corespeed/.mcp.json)" = "https://api.corespeed.io/mcp/plugin/chatgpt" ] \
            || { echo "::error file=plugins/corespeed/.mcp.json::must point at https://api.corespeed.io/mcp/plugin/chatgpt"; exit 1; }
          [ "$(jq -r .mcpServers plugins/corespeed/.claude-plugin/plugin.json)" = "./.mcp.claude.json" ] \
            || { echo "::error file=plugins/corespeed/.claude-plugin/plugin.json::mcpServers must be ./.mcp.claude.json"; exit 1; }
          [ "$(jq -r .mcpServers.corespeed.url plugins/corespeed/.mcp.claude.json)" = "https://api.corespeed.io/mcp" ] \
            || { echo "::error file=plugins/corespeed/.mcp.claude.json::must point at https://api.corespeed.io/mcp"; exit 1; }
      - name: The CLI plugin is skills-only and bundles the same cs-cli skill
        # corespeed-cli registers no MCP server: that is the point of it (a
        # client loads no tool list). Its cs-cli skill is a copy of the MCP
        # plugin's, which is the source; a drift here is a stale copy.
        run: |
          test ! -e plugins/corespeed-cli/.mcp.json \
            || { echo "::error::plugins/corespeed-cli must not carry .mcp.json"; exit 1; }
          jq -e 'has("mcpServers") | not' plugins/corespeed-cli/.codex-plugin/plugin.json > /dev/null \
            || { echo "::error file=plugins/corespeed-cli/.codex-plugin/plugin.json::skills-only plugin: no mcpServers"; exit 1; }
          cmp -s plugins/corespeed/skills/cs-cli/SKILL.md plugins/corespeed-cli/skills/cs-cli/SKILL.md \
            || { echo "::error::cs-cli skill differs between the plugins; plugins/corespeed/skills/cs-cli/SKILL.md is the source — copy it over"; exit 1; }
      - name: At most three default prompts
        # The Plugins Directory refuses a Codex manifest whose
        # interface.defaultPrompt has more than three entries
        # (plugin_default_prompt_too_many); the limit is checked here, not
        # at submission time.
        run: |
          for f in plugins/corespeed/.codex-plugin/plugin.json plugins/corespeed-cli/.codex-plugin/plugin.json; do
            jq -e '(.interface.defaultPrompt // []) | (type == "string") or (length <= 3 and all(type == "string" and length > 0))' "$f" > /dev/null \
              || { echo "::error file=$f::interface.defaultPrompt must be at most three non-empty strings"; exit 1; }
          done
      - name: Short descriptions fit the Directory listing
        # Final Directory submission refuses interface.shortDescription over 30
        # characters (submission_subtitle_too_long), a tighter limit than the
        # 240 package validation allows; held here so a manifest never passes
        # review and fails at submission.
        run: |
          for f in plugins/corespeed/.codex-plugin/plugin.json plugins/corespeed-cli/.codex-plugin/plugin.json; do
            jq -e '.interface.shortDescription | type == "string" and length > 0 and length <= 30' "$f" > /dev/null \
              || { echo "::error file=$f::interface.shortDescription must be 1–30 characters for Directory submission"; exit 1; }
          done
      - name: All corespeed manifests carry the same version
        run: |
          codex=$(jq -r .version plugins/corespeed/.codex-plugin/plugin.json)
          claude=$(jq -r .version plugins/corespeed/.claude-plugin/plugin.json)
          cursor=$(jq -r .version plugins/corespeed/.cursor-plugin/plugin.json)
          [ "$codex" = "$claude" ] && [ "$codex" = "$cursor" ] \
            || { echo "::error::Codex manifest is $codex, Claude Code manifest is $claude, Cursor manifest is $cursor"; exit 1; }
      - name: The Cursor plugin uses the plugin surface
        # Cursor reads the root .mcp.json through its manifest — the same
        # fixed plugin surface Codex gets, since Cursor loads every tool of a
        # server up front too — so the OAuth and surface checks above cover
        # it. A second mcp.json would shadow .mcp.json in Cursor and drift.
        run: |
          jq -e '.mcpServers == "./.mcp.json"' plugins/corespeed/.cursor-plugin/plugin.json > /dev/null \
            || { echo "::error file=plugins/corespeed/.cursor-plugin/plugin.json::mcpServers must be ./.mcp.json"; exit 1; }
          test ! -e plugins/corespeed/mcp.json \
            || { echo "::error::plugins/corespeed/mcp.json would shadow .mcp.json in Cursor; keep one MCP file"; exit 1; }

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@e1d5945aadbd710ed6cc18f216a4916eb1bafde6 # v1.2.719
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
